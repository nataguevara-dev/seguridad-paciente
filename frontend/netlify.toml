[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/frontend/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  VITE_API_BASE_URL = "https://seguridad-paciente-backend.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
